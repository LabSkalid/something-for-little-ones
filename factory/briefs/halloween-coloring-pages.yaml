# Новые листы по возрастам. Уже нарисованные страницы 3–4 фабрика не перезаписывает.
# Старые неиспользованные идеи (bat, owl, candy corn, patch) убраны, чтобы фабрика их не нарисовала.

slug: halloween-coloring-pages
title: Halloween Coloring Pages
tagline: Cute Halloween coloring pages for every age, not scary.
description: Free Halloween coloring pages that stay cute. Pick ages 2–3, 3–4, 4–5, 5–6, or 6–8.
kind: seasonal
ageBand: "3-4"
order: 2
accent: "#D4652F"
ink: "#2A1B14"
keywords:
  - halloween coloring pages
  - pumpkin coloring page
  - cute halloween coloring sheets
related:
  - fall-coloring-pages
  - christmas-coloring-pages
audience: parents choosing a cute Halloween coloring page by age
style: Cute Halloween coloring-book line art, sweet and not scary. No blood, no monsters, no graveyards. White background, solid black outlines only, no shading, no gray, no color, no text, no film characters. Eyes are open circles, never solid black. Windows are empty outlines, never filled black. Match the layout note for this age.
ideas:
  - slug: huge-pumpkin
    title: Huge Pumpkin Coloring Page
    prompt: One huge round pumpkin with a thick stem and one leaf. No carved face. Extra-thick outlines. No background, no text.
    difficulty: toddler
    age: "2-3"
    alt: Line drawing of one huge pumpkin with a stem and one leaf.
    description: A huge pumpkin coloring page for ages 2–3, one pumpkin to color.
    parentNote: The pumpkin is one big area. The leaf and the stem are optional second colors.
  - slug: huge-ghost
    title: Huge Ghost Coloring Page
    prompt: One huge friendly ghost, a simple rounded shape with two open-circle eyes and a small smile. Extra-thick outlines. Not scary. No background, no text. Eyes are not filled black.
    difficulty: toddler
    age: "2-3"
    alt: Line drawing of one huge friendly ghost with a small smile.
    description: A huge ghost coloring page for ages 2–3, one simple ghost.
    parentNote: The ghost is one shape. The eyes can stay uncolored. There is no dark scene behind it.
  - slug: huge-bat
    title: Huge Bat Coloring Page
    prompt: One huge cute bat seen from the front. One body and two simple wings as big shapes, two open-circle eyes, and a small smile. Extra-thick outlines. Not scary. No background, no text. No solid black fill.
    difficulty: toddler
    age: "2-3"
    alt: Line drawing of one huge cute bat with a smile and two wings.
    description: A huge bat coloring page for ages 2–3, one bat made of a few shapes.
    parentNote: The wings and the body can be the same color. The smile is a curve, not a row of teeth.
  - slug: candy-apple
    title: Candy Apple Coloring Page
    prompt: One candy apple on a stick with a bow and a small drip of coating as its own shape. A few big parts. No wrapper, no words, no table scene.
    difficulty: medium
    age: "4-5"
    alt: Line drawing of a candy apple on a stick with a bow.
    description: A candy apple coloring page for ages 4–5, with a stick and a bow.
    parentNote: The apple is the large area. The bow and the stick are the extra parts.
  - slug: little-cauldron
    title: Cauldron Coloring Page
    prompt: One round cauldron with two handles, three big bubbles, and a spoon. Thick outlines. Cute, not spooky. No background scene, no text, no face in the bubbles.
    difficulty: medium
    age: "4-5"
    alt: Line drawing of a cauldron with two handles, three bubbles, and a spoon.
    description: A cauldron coloring page for ages 4–5, with three bubbles.
    parentNote: The pot is one big color. Each bubble can be a different color if the child wants three small jobs.
  - slug: halloween-owl
    title: Owl and Hat Coloring Page
    prompt: One round owl wearing a small pointed hat with a buckle, sitting on a short branch. A few big feather shapes. Cute, not scary. Eyes are open circles, not filled black. No moon, no text.
    difficulty: medium
    age: "4-5"
    alt: Line drawing of a round owl in a small hat on a short branch.
    description: An owl and hat coloring page for ages 4–5, cute and not scary.
    parentNote: The body and the hat are the two main colors. The feathers are a few extra shapes, not a fine pattern.
  - slug: pumpkin-porch
    title: Pumpkin Porch Coloring Page
    prompt: A small cute porch scene with a door, two smiling pumpkins, a sitting cat, and a lantern. Smiles are simple curves. No house number, no scary faces, no text. Windows and the door window are empty outlines, not filled black. The cat eye is an open circle.
    difficulty: medium
    age: "5-6"
    alt: Line drawing of a porch with two smiling pumpkins, a cat, and a lantern.
    description: A pumpkin porch coloring page for ages 5–6, a door, pumpkins, and a cat.
    parentNote: The two pumpkins are the starting job. The cat and the lantern are the smaller pieces.
  - slug: moon-bats
    title: Moon and Bats Coloring Page
    prompt: A small scene with a large moon, three cute bats with smiles, and one tree. Bold outlines. Not scary. No text. Bat eyes are open circles, not filled black.
    difficulty: medium
    age: "5-6"
    alt: Line drawing of a moon, three cute bats, and one tree.
    description: A moon and bats coloring page for ages 5–6, three friendly bats.
    parentNote: Each bat can be the same color. The moon is one large shape to save for the end.
  - slug: pumpkin-path
    title: Pumpkin Path Coloring Page
    prompt: A small garden path with three pumpkins, a few flowers, and a short fence. One pumpkin has a simple smile. Bold outlines. Not scary. No text, no graveyard.
    difficulty: medium
    age: "5-6"
    alt: Line drawing of a garden path with three pumpkins, flowers, and a fence.
    description: A pumpkin path coloring page for ages 5–6, three pumpkins and flowers.
    parentNote: The pumpkins are the repeating shapes. The flowers and the fence are what is left after those are colored.
  - slug: patterned-porch
    title: Patterned Porch Coloring Page
    prompt: A fuller cute porch scene with steps, a patterned rug of stripes and dots, three pumpkins with simple stripe and dot patterns, two lanterns, a cat, and a wreath. Bold crayon-thick outlines, not hairline. No text, no scary faces. Windows are empty outlines, not solid black. Eyes are open circles.
    difficulty: detailed
    age: "6-8"
    alt: Line drawing of a porch with a patterned rug, patterned pumpkins, lanterns, and a cat.
    description: A patterned porch coloring page for ages 6–8, with a rug and pumpkins.
    parentNote: The rug and the pumpkin patterns are the long part. The cat can be one color at the end.
  - slug: night-garden
    title: Night Garden Coloring Page
    prompt: A fuller cute garden scene with a fence, patterned pumpkins, an owl on a post, a moon, and leaves. Bold crayon-thick outlines. Not scary. Eyes are circles to color, not filled black. No text, no graveyard.
    difficulty: detailed
    age: "6-8"
    alt: Line drawing of a night garden with patterned pumpkins, an owl, a fence, and a moon.
    description: A night garden coloring page for ages 6–8, pumpkins, an owl, and a moon.
    parentNote: Alternate two colors on the pumpkin patterns. The moon and the owl are the large shapes after that.
  - slug: cookie-table
    title: Cookie Table Coloring Page
    prompt: A fuller table scene of Halloween cookies and cupcakes. Cookies are stars, moons, and pumpkins with simple icing patterns of stripes and dots, no letters. A bowl and a plate. Bold crayon-thick outlines. No text, no wrapper logos, no characters.
    difficulty: detailed
    age: "6-8"
    alt: Line drawing of a table with patterned cookies, cupcakes, a bowl, and a plate.
    description: A cookie table coloring page for ages 6–8, with patterned cookies.
    parentNote: Pick one cookie shape and color all of those first. The icing dots can share one color across the plate.
