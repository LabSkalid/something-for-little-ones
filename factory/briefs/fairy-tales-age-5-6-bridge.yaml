ideas:
  - slug: billy-goats-gruff-on-the-bridge
    title: Billy Goats Gruff on the Bridge Coloring Page
    prompt: Three goats of different sizes stand on a simple wooden bridge of six wide planks. The largest goat is covered in large round spots, the same size as spots on a big dinosaur, not tiny scales. Each goat wears one round bell and has a beard of a few thick locks. Grass clumps grow at both ends of the bridge. One troll face with a few thick hair tufts peeks from under the bridge. White sky. No brick courses, no room, no floorboards, no crowd of people, no tiny feathers.
    difficulty: medium
    age: "5-6"
    alt: Line drawing of three goats on a wide-plank bridge, the largest covered in big spots, with bells, grass clumps, and a troll face underneath.
    description: Three goats cross a plank bridge, the largest one covered in big spots, while a troll peeks below.
    parentNote: The big spots, bells, and wide planks are separate regions to color, with open white sky around the bridge. Nothing on the page is a tiny pattern.
