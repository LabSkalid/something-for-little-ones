    prompt: One smiling young woman faces forward in a storybook ball gown and a five-point crown. Puffed sleeves, a fitted bodice with a center panel, vertical skirt panels, and a scalloped hem. One hand is raised, palm up, with a clear thumb and four fingers, and one small round bird stands on the palm. The other arm hangs at her side. Empty white background.
    difficulty: medium
