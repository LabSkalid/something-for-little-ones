style: Storybook coloring page in the same costume as a printed princess page. Puffed sleeves with cuffs, a fitted bodice with a center panel, an overskirt curve, vertical skirt panels, and a scalloped hem. Wavy hair in separate locks. A simple five-point crown. Each hand has a thumb and four simple fingers, not a mitten. Thick even black outlines, pure white background, no shading, no text, no film costume. No castle, no room, no crowd.
