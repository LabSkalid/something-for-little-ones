ideas:
  - slug: thumbelina-on-a-lily
    title: Thumbelina on a Lily Coloring Page
    prompt: A tiny girl in a plain long dress with six large petal shapes on the skirt sits in the middle of one open water lily. That lily has many separate crayon-sized petals. Around her are two more open water lilies with separate petals, three round lily pads, four cattails with oval heads, clumps of reeds, and one butterfly whose wings are split into a few large cells. White sky and open water. No room, no floorboards, no brick courses, no crowd, no castle.
    difficulty: medium
    age: "5-6"
    alt: Line drawing of a tiny girl in a petal dress sitting on a water lily among more lilies, lily pads, cattails, and a butterfly.
    description: Thumbelina sits on a water lily among petals, pads, and cattails.
    parentNote: Each petal, pad, and cattail is its own shape, so a child can color them one at a time. The girl and the butterfly stay large enough for a crayon.
  - slug: frog-prince-and-the-ball
    title: Frog Prince and the Ball Coloring Page
    prompt: One large frog covered in separate round spots, wearing a simple crown with five large jewel circles, sits on a rock and holds a round ball divided into wide stripes. Around the frog are three lily pads, two open water lilies with separate petals, four cattails, two simple clouds, and clumps of reeds. White sky. No castle, no room, no floorboards, no brick courses, no crowd, and no second person.
    difficulty: medium
    age: "5-6"
    alt: Line drawing of a spotted frog in a simple crown holding a striped ball among lily pads, water lilies, and cattails.
    description: A spotted frog in a simple crown holds a striped ball by the pond.
    parentNote: The spots, crown jewels, and ball stripes are separate regions a child can color one by one. The pond plants stay medium-sized, with open white sky around them.
  - slug: the-golden-goose
    title: Golden Goose Coloring Page
    prompt: One large goose whose body is divided into many separate feather shapes stands beside one child in a plain coat with four large patches. Three eggs with spots sit in a simple nest of a few twigs. Nearby are four daisies with separate petals and two grass clumps. White background. No village, no crowd, no room, no floorboards, no brick courses.
    difficulty: medium
    age: "5-6"
    alt: Line drawing of a goose with separate feathers beside a child in a patched coat, with spotted eggs, a twig nest, and daisies.
    description: A goose with separate feathers stands by a child in a patched coat and a nest of spotted eggs.
    parentNote: The feathers, coat patches, and egg spots give a lot of regions without a crowded scene. Each one is still big enough to color with a crayon.
